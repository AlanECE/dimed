[project]
name = "dimed-api"
version = "0.1.0"
description = "DIMED pharmaceutical logistics API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "redis>=5.2.0",
    "ruff>=0.8.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0",
    "python-barcode[images]>=0.15",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    "google-auth>=2.35.0",
    "fastapi-mail>=1.4.2",
    "slowapi>=0.1.9",
    "num2words>=0.5.14",
    "requests>=2.32",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
