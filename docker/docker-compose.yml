services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dimed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dimed}
      POSTGRES_DB: ${POSTGRES_DB:-dimed}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimed"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
      - ../packages/ocr:/packages/ocr
    environment:
      DIMED_DATABASE_URL: ${DIMED_DATABASE_URL:-postgresql+asyncpg://dimed:dimed@db:5432/dimed}
      DIMED_REDIS_URL: ${DIMED_REDIS_URL:-redis://redis:6379/0}
      DIMED_SECRET_KEY: ${DIMED_SECRET_KEY:-dev-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: pnpm dev

volumes:
  pgdata:
