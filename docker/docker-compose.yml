services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dimed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dimed}
      POSTGRES_DB: ${POSTGRES_DB:-dimed}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimed"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
      - ../apps/storage:/storage

    environment:
      DIMED_ENVIRONMENT: ${DIMED_ENVIRONMENT:-development}
      DIMED_DATABASE_URL: ${DIMED_DATABASE_URL:-postgresql+asyncpg://dimed:dimed@db:5432/dimed}
      DIMED_REDIS_URL: ${DIMED_REDIS_URL:-redis://redis:6379/0}
      DIMED_SECRET_KEY: ${DIMED_SECRET_KEY:-dev-secret-change-in-production}
      DIMED_FRONTEND_URL: ${DIMED_FRONTEND_URL:-http://localhost:3000}
      DIMED_GOOGLE_CLIENT_ID: ${DIMED_GOOGLE_CLIENT_ID:-}
      DIMED_SMTP_HOST: ${DIMED_SMTP_HOST:-mailhog}
      DIMED_SMTP_PORT: ${DIMED_SMTP_PORT:-1025}
      DIMED_SMTP_FROM: ${DIMED_SMTP_FROM:-no-reply@dimed.dz}
      DIMED_SMTP_TLS: ${DIMED_SMTP_TLS:-false}
      DIMED_SMTP_SSL: ${DIMED_SMTP_SSL:-false}
      DIMED_OPENROUTER_API_KEY: ${DIMED_OPENROUTER_API_KEY:-}
      DIMED_OCR_MODEL: ${DIMED_OCR_MODEL:-baidu/ernie-4.5-vl-424b-a47b}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: pnpm dev

volumes:
  pgdata:
